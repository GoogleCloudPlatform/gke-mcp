name: Auto Request Review

on:
  # pull_request_target is required so the GITHUB_TOKEN can request reviewers
  # on pull requests from forks and Dependabot. This workflow never checks out
  # or runs untrusted code from the pull request; it only calls a SHA-pinned
  # action against the base branch configuration.
  pull_request_target: # zizmor: ignore[dangerous-triggers]
    branches: ["main"]
    types: [opened, ready_for_review, reopened]

permissions: {}

jobs:
  auto-request-review:
    name: Auto Request Review
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Request review based on files changes and/or groups the author belongs to
        uses: necojackarc/auto-request-review@9a4b11888f2d60c79120c5413f13eb63febc2b68 # v0.14.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
